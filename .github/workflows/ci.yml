name: CI - Website Quality Check

on:
  push:
    branches: [main, 'feature/*', 'hotfix/*']
  pull_request:
    branches: [main]

jobs:
  php-lint:
    name: PHP Syntax Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check PHP syntax
        run: |
          find site/ -name "*.php" -not -path "*/dayrui/CodeIgniter72/*" | while read f; do
            php -l "$f" || exit 1
          done

  nginx-config-check:
    name: Nginx Config Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install nginx
        run: sudo apt-get update && sudo apt-get install -y nginx
      - name: Test nginx config syntax
        run: |
          nginx -t -c ${{ github.workspace }}/infra/nginx.conf 2>&1 || echo "Config may need server paths, manual review required"

  secret-scan:
    name: Secrets Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan for secrets
        run: |
          ! grep -rnE "(password|passwd|pwd|secret|token|api_key|apikey)\s*[=:]\s*['\"][^'\"]{8,}" \
            --include="*.php" --include="*.js" --include="*.conf" --include="*.yml" --include="*.yaml" \
            --include="*.md" --include="*.sh" \
            --exclude-dir=".github" \
            site/ config/ infra/ scripts/ docs/ 2>/dev/null \
            || { echo "Potential secrets found!"; exit 1; }

  html-check:
    name: HTML Structure Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check HTML files
        run: |
          find site/template/ -name "*.html" | while read f; do
            if [ -f "$f" ]; then
              grep -c "<html" "$f" > /dev/null 2>&1 || true
            fi
          done
          echo "HTML check complete"
