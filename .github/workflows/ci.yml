name: repository-ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up PHP 7.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '7.4'
          coverage: none

      - name: PHP syntax
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t files < <(find scripts -type f -name '*.php' -print)
          for f in "${files[@]}"; do php -l "$f"; done

      - name: Shell syntax
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t files < <(find scripts -type f -name '*.sh' -print)
          for f in "${files[@]}"; do bash -n "$f"; done

      - name: Validate JSON
        shell: bash
        run: |
          python3 - <<'PY'
          import json, pathlib
          paths = list(pathlib.Path('content').rglob('*.json')) + list(pathlib.Path('config').glob('*.json'))
          for path in paths:
              json.loads(path.read_text(encoding='utf-8'))
          print(f'validated {len(paths)} json files')
          PY

      - name: Validate pending agent job pins
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, pathlib, re, subprocess, sys

          pending = pathlib.Path('ops/jobs/pending')
          jobs = sorted(pending.glob('*.json')) if pending.is_dir() else []
          allowed_task = re.compile(r'^scripts/ops/agent_tasks/[A-Za-z0-9._/-]+\.sh$')
          job_id_re = re.compile(r'^[a-z0-9][a-z0-9._-]{2,80}$')
          commit_re = re.compile(r'^[0-9a-f]{40}$')
          sha_re = re.compile(r'^[0-9a-f]{64}$')

          for path in jobs:
              job = json.loads(path.read_text(encoding='utf-8'))
              job_id = str(job.get('job_id', ''))
              commit = str(job.get('required_commit', ''))
              script = str(job.get('script', ''))
              expected = str(job.get('script_sha256', ''))
              timeout = job.get('timeout_seconds', 900)

              if job.get('schema_version') != 1:
                  raise SystemExit(f'{path}: invalid schema_version')
              if not job_id_re.fullmatch(job_id) or path.name != f'{job_id}.json':
                  raise SystemExit(f'{path}: invalid job_id/path')
              if not commit_re.fullmatch(commit):
                  raise SystemExit(f'{path}: invalid required_commit')
              if not (script == 'scripts/ops/chatgpt_finalize_publisher_v5.sh' or allowed_task.fullmatch(script)):
                  raise SystemExit(f'{path}: disallowed script')
              if '..' in script or script.startswith('/'):
                  raise SystemExit(f'{path}: unsafe script path')
              if not sha_re.fullmatch(expected):
                  raise SystemExit(f'{path}: invalid script_sha256')
              if not isinstance(timeout, int) or not (10 <= timeout <= 1800):
                  raise SystemExit(f'{path}: invalid timeout')

              subprocess.run(['git', 'cat-file', '-e', f'{commit}^{{commit}}'], check=True)
              proc = subprocess.run(['git', 'show', f'{commit}:{script}'], check=True, stdout=subprocess.PIPE)
              actual = hashlib.sha256(proc.stdout).hexdigest()
              if actual != expected:
                  raise SystemExit(f'{path}: script hash mismatch expected={expected} actual={actual}')

          print(f'validated {len(jobs)} pending agent job pins')
          PY

      - name: Validate all production smoke fixtures
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t fixtures < <(find content/smoke -maxdepth 1 -type f -name '*.json' -print | sort)
          [ "${#fixtures[@]}" -gt 0 ]
          for fixture in "${fixtures[@]}"; do
            out=$(mktemp)
            php scripts/content/publisher_smoke.php --article="$fixture" --offline | tee "$out"
            grep -Fq 'OFFLINE FIXTURE PASS' "$out"
            rm -f "$out"
          done
          echo "validated ${#fixtures[@]} smoke fixtures offline"

      - name: Reject duplicate native PDO placeholders
        shell: bash
        run: |
          python3 - <<'PY'
          import pathlib, re, sys
          path = pathlib.Path('scripts/content/cms_publish_adapter.php')
          src = path.read_text(encoding='utf-8')
          blocks = re.findall(r'->prepare\((.*?)\)\s*(?:->|;)', src, flags=re.S)
          failed = False
          for index, block in enumerate(blocks, 1):
              names = re.findall(r':([A-Za-z_][A-Za-z0-9_]*)', block)
              duplicates = sorted({name for name in names if names.count(name) > 1})
              if duplicates:
                  print(f'ERROR: prepare block {index} reuses named placeholders with native prepares: {duplicates}', file=sys.stderr)
                  failed = True
          if failed:
              sys.exit(1)
          print(f'validated {len(blocks)} prepared-statement blocks: no duplicate named placeholders')
          PY

      - name: Reject tracked secret files
        shell: bash
        run: |
          set -euo pipefail
          bad=0
          for path in site/config/database.php config/database.php .env; do
            if git ls-files --error-unmatch "$path" >/dev/null 2>&1; then
              echo "ERROR: sensitive runtime file is tracked: $path" >&2
              bad=1
            fi
          done
          if [ "$bad" -ne 0 ]; then exit 1; fi

          # Match an actual PEM/OpenSSH private-key header rather than prose or
          # defensive code that merely mentions the words "private key".
          if git grep -I -n -E -- '-----BEGIN (RSA |OPENSSH |EC )?PRIVATE KEY-----' -- .; then
            echo 'ERROR: private key material detected in tracked content.' >&2
            exit 1
          fi

      - name: SEO foundation checks
        shell: bash
        run: |
          set -euo pipefail
          grep -q '^User-agent:' site/robots.txt
          grep -q '^Sitemap: https://www.laocaimi.org/sitemap.xml$' site/robots.txt
          if grep -q '<meta name="robots" content="none">' site/template/pc/default/home/index.html; then
            echo 'WARNING: legacy homepage still contains robots=none; production deployment must remain blocked unless deploy-time guard repairs it.'
          fi
