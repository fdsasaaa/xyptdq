name: verify-recovery-secret
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['ops/recovery-secret-check.json']
permissions: {}
jobs:
  verify-owner-recovery-file:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify recovery secret without displaying its contents
        env:
          XYPTDQ_RECOVERY_JSON: ${{ secrets.XYPTDQ_RECOVERY_JSON }}
        run: |
          python3 - <<'PY'
          import datetime as dt
          import hashlib
          import hmac
          import json
          import os
          import sys

          expected = 'e8a866fb7f115c1f7f3d6dbb9c83fb1cc68ca3173644a303dd294f92883ead13'
          try:
              raw = os.environ.get('XYPTDQ_RECOVERY_JSON', '')
              if not raw.strip():
                  raise ValueError('missing secret')
              envelope = json.loads(raw)
              if (envelope.get('schema_version') != 1
                      or envelope.get('project') != 'xyptdq'
                      or envelope.get('repository') != 'rclone:onedrive:WebsiteBackups/xyptdq/restic-v1'
                      or not isinstance(envelope.get('repository_password'), str)
                      or len(envelope['repository_password']) < 24):
                  raise ValueError('invalid recovery envelope')
              # Normalize JSON layout and clipboard line endings; verify the original logical file.
              canonical = (json.dumps(envelope, sort_keys=True, separators=(',', ':'), ensure_ascii=True) + '\n').encode('ascii')
              actual = hashlib.sha256(canonical).hexdigest()
              if not hmac.compare_digest(actual, expected):
                  raise ValueError('unexpected recovery file')
          except Exception:
              # Never print exception details: JSON parsing errors can contain secret excerpts.
              print('::error::Recovery secret is missing or does not match the verified owner recovery file.')
              sys.exit(1)

          result = {'schema_version': 1, 'status': 'PASS', 'project': 'xyptdq',
                    'github_secret_available': True, 'verified_owner_file_sha256': actual,
                    'credential_contents_published': False,
                    'verification_scope': 'cloud secret escrow only; no production restore performed',
                    'observed_at': dt.datetime.now(dt.timezone.utc).isoformat(),
                    'run_id': os.environ['GITHUB_RUN_ID'], 'source_commit': os.environ['GITHUB_SHA']}
          print(json.dumps(result, sort_keys=True))
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write('Recovery secret matches the independently verified owner file.\n\n')
              summary.write('No password or recovery-file contents were printed or uploaded as artifacts.\n')
          PY
