name: content-bridge-test

on:
  pull_request:
    paths:
      - 'scripts/content/**'
      - 'scripts/seo/live_publication_seo_test.php'
      - 'scripts/seo/verify_publication_seo.php'
      - 'scripts/seo/lib/live_publication_seo.php'
      - 'config/content_category_map.json'
      - 'config/content_inventory_policy.json'
      - 'config/content_source_sync_policy.json'
      - 'content/seo_cluster_registry.json'
      - 'content/drafts/**'
      - 'content/ingress/**'
      - 'docs/CONTENT_PACKAGE_BRIDGE.md'
      - '.github/workflows/content-bridge-test.yml'
  push:
    branches:
      - main
    paths:
      - 'scripts/content/**'
      - 'scripts/seo/live_publication_seo_test.php'
      - 'scripts/seo/verify_publication_seo.php'
      - 'scripts/seo/lib/live_publication_seo.php'
      - 'config/content_category_map.json'
      - 'config/content_inventory_policy.json'
      - 'config/content_source_sync_policy.json'
      - 'content/seo_cluster_registry.json'
      - 'content/drafts/**'
      - 'content/ingress/**'
      - 'docs/CONTENT_PACKAGE_BRIDGE.md'
      - '.github/workflows/content-bridge-test.yml'

jobs:
  content-bridge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '7.4'
          coverage: none
      - name: PHP syntax check
        run: |
          find scripts/content -type f -name '*.php' -print0 | xargs -0 -n1 php -l
          php -l scripts/seo/lib/live_publication_seo.php
          php -l scripts/seo/verify_publication_seo.php
          php -l scripts/seo/live_publication_seo_test.php
      - name: Python inventory syntax check
        run: python3 -m py_compile scripts/content/inventory_diff.py
      - name: Inventory policy JSON check
        run: |
          python3 -m json.tool config/content_inventory_policy.json >/dev/null
          python3 -m json.tool config/content_source_sync_policy.json >/dev/null
      - name: Offline bridge self-test
        run: php scripts/content/self_test.php
      - name: Smoke batch 1 converter verification
        run: php scripts/content/smoke_batch1_test.php
      - name: Smoke batch 2 converter verification
        run: php scripts/content/smoke_batch2_test.php
      - name: SEO cluster metadata bridge regression
        run: php scripts/content/seo_cluster_metadata_test.php
      - name: Draft metadata refresh safety verification
        run: php scripts/content/metadata_refresh_test.php
      - name: Public-release intake contract regression
        run: php scripts/content/public_release_intake_test.php
      - name: Public-release canary Draft regression
        run: php scripts/content/public_release_canary_test.php
      - name: Sanitized public-release transfer canary regression
        run: php scripts/content/public_release_transfer_canary_test.php
      - name: First-wave sanitized transfer batch regression
        run: php scripts/content/public_release_transfer_batch_test.php
      - name: Publisher source isolation regression
        run: php scripts/content/publisher_source_isolation_test.php
      - name: Website SEO portfolio ownership audit
        run: php scripts/content/seo_portfolio_audit.php
      - name: Website SEO portfolio audit regression
        run: php scripts/content/seo_portfolio_audit_test.php
      - name: Publication receipt export regression
        run: php scripts/content/publication_receipt_test.php
      - name: Live publication SEO verification regression
        run: php scripts/seo/live_publication_seo_test.php
