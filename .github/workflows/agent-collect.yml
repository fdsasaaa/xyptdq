name: agent-result-collector

on:
  push:
    branches: [main]
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: xyptdq-agent-result-collector
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Collect sanitized bridge results
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, pathlib, re, subprocess, sys, urllib.request

          pending_dir = pathlib.Path('ops/jobs/pending')
          results_dir = pathlib.Path('ops/jobs/results')
          results_dir.mkdir(parents=True, exist_ok=True)
          blocked_keys = {
              'password', 'passwd', 'token', 'cookie', 'secret', 'private_key',
              'dsn', 'database_password', 'authorization', 'credential',
              'credentials', 'api_key'
          }

          def inspect(value):
              if isinstance(value, dict):
                  for key, child in value.items():
                      if str(key).lower() in blocked_keys:
                          raise ValueError('sensitive payload key rejected')
                      inspect(child)
              elif isinstance(value, list):
                  for child in value:
                      inspect(child)
              elif isinstance(value, str):
                  upper = value.upper()
                  forbidden = [
                      'BEGIN ' + 'PRIVATE KEY',
                      'BEGIN RSA ' + 'PRIVATE KEY',
                      'BEGIN OPENSSH ' + 'PRIVATE KEY',
                  ]
                  if any(marker in upper for marker in forbidden):
                      raise ValueError('private key material rejected')
                  if re.search(r'https?://[^/\s:@]+:[^/\s@]+@', value):
                      raise ValueError('credential-bearing URL rejected')

          collected = 0
          if pending_dir.is_dir():
              for job_path in sorted(pending_dir.glob('*.json')):
                  job = json.loads(job_path.read_text(encoding='utf-8'))
                  job_id = str(job.get('job_id', ''))
                  if not re.fullmatch(r'[a-z0-9][a-z0-9._-]{2,80}', job_id):
                      continue
                  out_path = results_dir / f'{job_id}.json'
                  if out_path.exists():
                      continue
                  url = f'https://www.laocaimi.org/uploadfile/xyptdq-agent-results/{job_id}.json'
                  try:
                      req = urllib.request.Request(url, headers={'User-Agent': 'xyptdq-agent-result-collector/1'})
                      with urllib.request.urlopen(req, timeout=15) as resp:
                          if getattr(resp, 'status', 200) != 200:
                              continue
                          raw = resp.read(65537)
                  except Exception:
                      continue
                  if not raw or len(raw) > 65536:
                      continue
                  try:
                      result = json.loads(raw.decode('utf-8'))
                      if not isinstance(result, dict):
                          continue
                      if result.get('schema_version') != 1:
                          continue
                      if result.get('job_id') != job_id:
                          continue
                      if result.get('required_commit') != job.get('required_commit'):
                          continue
                      if result.get('script') != job.get('script'):
                          continue
                      if result.get('script_sha256') != job.get('script_sha256'):
                          continue
                      if result.get('status') not in {'PASS','FAIL','INTERRUPTED','RESULT_REJECTED'}:
                          continue
                      if not isinstance(result.get('exit_code'), int):
                          continue
                      if result.get('raw_log_published') is not False:
                          continue
                      payload = result.get('payload', {})
                      if not isinstance(payload, dict):
                          continue
                      inspect(result)
                  except Exception:
                      continue
                  out_path.write_text(json.dumps(result, ensure_ascii=False, indent=2, sort_keys=True) + '\n', encoding='utf-8')
                  collected += 1

          print(f'collected={collected}')
          PY

      - name: Commit collected results
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- ops/jobs/results; then
            echo 'No new server results.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ops/jobs/results
          git diff --cached --check
          git commit -m 'Collect sanitized server bridge results'
          git push origin HEAD:main
