# ============================================================
# Main Site - Canonical: https://www.laocaimi.org
# Managed by WorkBuddy
# SSL: Let's Encrypt /etc/letsencrypt/live/laocaimi.org/
# ============================================================

# HTTP -> HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name www.laocaimi.org laocaimi.org;

    location ^~ /.well-known/acme-challenge/ {
        root /www/wwwroot/59.110.217.6;
        try_files $uri =404;
    }

    location / {
        return 301 https://www.laocaimi.org$request_uri;
    }
}

# Main HTTPS - www.laocaimi.org
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.laocaimi.org;

    root /www/wwwroot/59.110.217.6;
    index index.php index.html;
    client_max_body_size 50M;

    gzip on;
    gzip_min_length 1k;
    gzip_comp_level 6;
    gzip_types text/plain application/javascript application/x-javascript text/css application/xml text/javascript application/x-httpd-php image/jpeg image/gif image/png;
    gzip_vary on;

    location ~ .*\.(gif|jpg|jpeg|png|bmp|swf)$ { expires 30d; error_log /dev/null; access_log /dev/null; }
    location ~ .*\.(js|css)?$ { expires 12h; error_log /dev/null; access_log /dev/null; }

    ssl_certificate     /etc/letsencrypt/live/laocaimi.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/laocaimi.org/privkey.pem;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    add_header Strict-Transport-Security "max-age=31536000" always;

    location ^~ /.well-known/acme-challenge/ {
        root /www/wwwroot/59.110.217.6;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /site/index.php?$query_string;
    }

    location ~* ^/site/(uploadfile|cache|static)/.*\.php$ { deny all; }

    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php7.4-fpm.sock;
        fastcgi_param HTTPS on;
        fastcgi_param HTTP_X_FORWARDED_PROTO https;
    }

    location ~ /\. { deny all; }
}

